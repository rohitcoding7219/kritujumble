<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CipherBox — Encrypt & Decrypt Letters</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --accent: #38bdf8;
    --accent2: #a78bfa;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg), #1e1b4b);
    font-family: 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    background: var(--panel);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 640px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.subtitle {
    text-align: center;
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 24px;
    font-size: 0.9rem;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  input[type="text"], textarea {
    width: 100%;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 0.95rem;
    resize: vertical;
    font-family: inherit;
  }
  textarea { min-height: 100px; margin-bottom: 18px; }
  .key-row { margin-bottom: 18px; }
  .btn-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }
  button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  button:active { transform: scale(0.97); }
  #encodeBtn { background: var(--accent); color: #0f172a; }
  #decodeBtn { background: var(--accent2); color: #0f172a; }
  #copyBtn {
    background: transparent;
    border: 1px solid #334155;
    color: var(--muted);
    flex: 0 0 auto;
    padding: 12px 16px;
  }
  #output {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    min-height: 100px;
    padding: 12px;
    word-break: break-all;
    font-family: 'Courier New', monospace;
    font-size: 0.95rem;
    white-space: pre-wrap;
  }
  .footer-note {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>CipherBox</h1>
  <p class="subtitle">Turn any text into a random-looking code, and back again — using your own secret key.</p>

  <label for="keyInput">Secret Key (any word or phrase)</label>
  <div class="key-row">
    <input type="text" id="keyInput" placeholder="e.g. mySecret123" value="mySecret123">
  </div>

  <label for="inputText">Text</label>
  <textarea id="inputText" placeholder="Type letters or words here..."></textarea>

  <div class="btn-row">
    <button id="encodeBtn">🔒 Encrypt</button>
    <button id="decodeBtn">🔓 Decrypt</button>
    <button id="copyBtn">Copy</button>
  </div>

  <label for="output">Result</label>
  <div id="output"></div>

  <p class="footer-note">Same key must be used to encrypt and decrypt. This runs entirely in your browser — nothing is sent anywhere.</p>
</div>

<script>
  // --- Core reversible cipher logic ---
  // Each character is XORed with a rotating key character,
  // then represented as a 2-digit hex "code" so the result looks random.
  // Decrypting reverses the exact same steps.

  function encrypt(text, key) {
    if (!key) return "⚠️ Please enter a secret key.";
    let result = "";
    for (let i = 0; i < text.length; i++) {
      const charCode = text.charCodeAt(i);
      const keyCode = key.charCodeAt(i % key.length);
      const xored = charCode ^ keyCode;
      // pad to 3 digits so codes stay uniform-looking
      result += xored.toString(16).padStart(3, "0");
    }
    return result;
  }

  function decrypt(code, key) {
    if (!key) return "⚠️ Please enter a secret key.";
    if (code.length % 3 !== 0) return "⚠️ This doesn't look like a valid encrypted code.";
    let result = "";
    try {
      for (let i = 0; i < code.length; i += 3) {
        const hexChunk = code.substring(i, i + 3);
        const xored = parseInt(hexChunk, 16);
        const keyCode = key.charCodeAt((i / 3) % key.length);
        const charCode = xored ^ keyCode;
        result += String.fromCharCode(charCode);
      }
    } catch (e) {
      return "⚠️ Could not decrypt — check your key or the code.";
    }
    return result;
  }

  // --- UI wiring ---
  const inputText = document.getElementById("inputText");
  const keyInput = document.getElementById("keyInput");
  const output = document.getElementById("output");

  document.getElementById("encodeBtn").addEventListener("click", () => {
    output.textContent = encrypt(inputText.value, keyInput.value.trim());
  });

  document.getElementById("decodeBtn").addEventListener("click", () => {
    output.textContent = decrypt(inputText.value.trim(), keyInput.value.trim());
  });

  document.getElementById("copyBtn").addEventListener("click", () => {
    if (!output.textContent) return;
    navigator.clipboard.writeText(output.textContent).then(() => {
      const btn = document.getElementById("copyBtn");
      const original = btn.textContent;
      btn.textContent = "Copied!";
      setTimeout(() => (btn.textContent = original), 1200);
    });
  });
</script>

</body>
</html>
